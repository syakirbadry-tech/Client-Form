<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'none'; img-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dashboard Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="setupForm" novalidate>
      <div>
        <h1>Dashboard Setup</h1>
        <p>Creates the two secret values for the Cloudflare Worker. Everything is worked out on this device; nothing you type here is sent anywhere.</p>
      </div>
      <div class="alert" id="setupError" role="alert" hidden></div>
      <div class="field">
        <label for="password">New dashboard password (8+ characters)</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm">Type it again</label>
        <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" id="setupBtn" type="submit">Generate values</button>

      <div id="results" hidden>
        <div class="field">
          <label for="hashOut">ADMIN_PASSWORD_HASH</label>
          <textarea class="input" id="hashOut" rows="3" readonly></textarea>
          <button class="btn" type="button" data-copy="hashOut">Copy</button>
        </div>
        <div class="field">
          <label for="secretOut">ADMIN_SESSION_SECRET</label>
          <textarea class="input" id="secretOut" rows="2" readonly></textarea>
          <button class="btn" type="button" data-copy="secretOut">Copy</button>
        </div>
      </div>
      <div class="login-foot">Paste each value into Cloudflare as a <strong>Secret</strong>, then close this tab.</div>
    </form>
  </div>
  <script src="icons.js"></script>
  <script src="admin.js"></script>
  <script src="setup.js"></script>
</body>
</html>
