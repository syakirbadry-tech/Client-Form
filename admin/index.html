<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Staff Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" novalidate>
      <div>
        <h1>Staff Sign In</h1>
        <p>PruBSN client submissions dashboard</p>
      </div>
      <div class="alert" id="loginError" role="alert" hidden></div>
      <div class="field">
        <label for="username">Email</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" id="loginBtn" type="submit">Sign in</button>
      <div class="login-foot">Authorised staff only. Sessions end after 8 hours or when you close this tab.</div>
    </form>

    <form class="login-card" id="setupForm" novalidate hidden>
      <div>
        <h1>Choose your password</h1>
        <p>You signed in with a temporary password. Choose your own password to continue – nobody else will see it.</p>
      </div>
      <div class="alert" id="setupError" role="alert" hidden></div>
      <input type="email" name="email" autocomplete="username" hidden>
      <div class="field">
        <label for="newPassword">New password (at least 8 characters)</label>
        <input class="input" id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="newPassword2">Type it again</label>
        <input class="input" id="newPassword2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-primary" id="setupBtn" type="submit">Save password and sign in</button>
      <button class="link-btn" id="showLogin" type="button">Back to sign in</button>
    </form>
  </div>
  <script src="admin.js"></script>
  <script src="login.js"></script>
</body>
</html>
