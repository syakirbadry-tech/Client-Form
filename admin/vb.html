<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <title>VB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>VB</h1>
      <div class="topbar-sub" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <main>
    <div class="alert" id="pageError" role="alert" hidden></div>

    <section class="stats vb-stats" id="stats" aria-label="This week"></section>

    <div class="toolbar">
      <input class="input" id="search" type="search" placeholder="Search name or phone" aria-label="Search names">
      <div class="chips" id="chips" role="group" aria-label="Filter by stage"></div>
      <div class="toolbar-actions">
        <button class="btn btn-primary" id="addBtn" type="button">+ Add name</button>
      </div>
    </div>

    <section class="panel">
      <ul class="vb-list" id="rows"></ul>
      <div class="empty" id="empty" hidden></div>
    </section>

    <section class="panel" id="teamPanel" hidden>
      <div class="insight-table-head"><h2>Team this week <span class="sub">counts only</span></h2></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Agent</th><th class="right">VB1</th><th class="right">VB2</th><th class="right">VB3</th><th class="right">VB4</th><th class="right">Cases</th><th class="right">TPC</th><th class="right">Now at VB1 / 2 / 3 / 4</th></tr>
          </thead>
          <tbody id="teamRows"></tbody>
        </table>
      </div>
      <p class="sub insight-note">Leaders see how many names each agent has at each stage, never the names themselves.</p>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <div class="grow">
        <h2 id="drawerTitle"></h2>
        <div class="sub" id="drawerSub"></div>
      </div>
      <button class="btn" id="closeDrawer" type="button">Close</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script src="admin.js"></script>
  <script src="vb.js"></script>
</body>
</html>
