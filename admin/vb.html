<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>VB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
  <script defer blocking="render" src="icons.js"></script>
  <script defer blocking="render" src="admin.js"></script>
  <script defer blocking="render" src="vb.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">
      <h1>VB pipeline</h1>
      <div class="sub" id="lastUpdated">Loading…</div>
    </div>
    <button class="btn btn--primary vb-add" id="addBtn" type="button"></button>
  </header>

  <main class="vbp">
    <div class="alert" id="pageError" role="alert" hidden></div>

    <section class="stages" id="stats" aria-label="Names at each stage"></section>
    <p class="note vb-weeknote" id="weekNote" hidden></p>

    <label class="search">
      <span class="sr-only">Search names</span>
      <span id="searchIcon" aria-hidden="true"></span>
      <input class="input" id="search" type="search" placeholder="Search name or phone" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by stage" hidden></div>

    <div class="vb-listhead"><h2 id="listTitle">All names</h2><span class="sub" id="listSort">Next step first</span></div>
    <div class="list vb-plist" id="rows" role="list" aria-labelledby="listTitle"></div>
    <div class="empty" id="empty" hidden></div>

    <section class="card vb-team" id="teamPanel" hidden>
      <div class="card__head"><h2>Team this week</h2><span class="sub">counts only</span></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Agent</th><th class="right">VB1</th><th class="right">VB2</th><th class="right">VB3</th><th class="right">VB4</th><th class="right">Cases</th><th class="right">TPC</th><th class="right">Now at VB1 / 2 / 3 / 4</th></tr>
          </thead>
          <tbody id="teamRows"></tbody>
        </table>
      </div>
      <p class="sub vb-team__note">Leaders see how many names each agent has at each stage, never the names themselves.</p>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet cust-sheet" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head cust-sheet__head">
      <div class="grow">
        <h2 class="cust-sheet__title" id="drawerTitle"></h2>
        <div class="sub" id="drawerSub"></div>
      </div>
      <button class="sheet__close" id="closeDrawer" type="button" aria-label="Close"></button>
    </div>
    <div class="cust-body" id="drawerBody"></div>
  </aside>
</body>
</html>
