<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self' blob: https://*.airtableusercontent.com https://dl.airtable.com; form-action 'none'; base-uri 'none'">
  <title>Client Submissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Client Submissions</h1>
      <div class="topbar-sub" id="lastUpdated">Loading…</div>
    </div>
    <div class="topbar-right">
      <span class="who" id="who"></span>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
      <button class="btn" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <div class="alert" id="pageError" role="alert" hidden></div>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="toolbar">
      <input class="input" id="search" type="search" placeholder="Search name, NRIC, phone or email" aria-label="Search submissions">
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      <div class="toolbar-actions">
        <button class="btn btn-gold" id="exportBtn" type="button">Export CSV</button>
      </div>
    </div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Client</th>
            <th class="col-hide-sm">Contact</th>
            <th class="col-hide-md">Plan</th>
            <th>Status</th>
            <th class="col-hide-sm">Submitted</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <div class="grow">
        <h2 id="drawerTitle"></h2>
        <div class="sub" id="drawerSub"></div>
        <div class="status-row" id="statusRow"></div>
      </div>
      <button class="btn" id="closeDrawer" type="button" aria-label="Close">Close</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script src="admin.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
