<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self' blob: https://*.airtableusercontent.com https://dl.airtable.com; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
  <script defer blocking="render" src="config.js"></script>
  <script defer blocking="render" src="icons.js"></script>
  <script defer blocking="render" src="admin.js"></script>
  <script defer blocking="render" src="dashboard.js"></script>
</head>
<body>
  <header class="topbar" data-bell>
    <div class="topbar__title">
      <h1>Customers</h1>
      <div class="sub" id="lastUpdated">Loading…</div>
    </div>
    <button class="btn btn--ghost" id="selectBtn" type="button" hidden>Select</button>
    <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh"></button>
  </header>

  <!-- Select mode (owner): replaces the header -->
  <div class="bulkhead" id="bulkHead" hidden>
    <button class="btn btn--ghost" id="selectAll" type="button">Select all</button>
    <b id="selectedCount" aria-live="polite">0 selected</b>
    <button class="btn btn--ghost" id="selectDone" type="button">Done</button>
  </div>

  <main class="cust">
    <div class="alert" id="pageError" role="alert" hidden></div>

    <section class="statstrip" id="stats" aria-label="Summary"></section>

    <div class="cust-tools">
      <label class="search grow">
        <span class="sr-only">Search customers</span>
        <span id="searchIcon" aria-hidden="true"></span>
        <input class="input" id="search" type="search" placeholder="Search name, NRIC, phone or plan" autocomplete="off">
      </label>
      <select class="input agent-filter" id="agentFilter" aria-label="Filter by agent" hidden></select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>

    <div class="list cust-list" id="rows" role="list" aria-label="Customers"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="cust-foot"><button class="btn btn--ghost" id="exportBtn" type="button">Export CSV</button></div>

    <p class="cust-foot"><button class="btn btn--ghost" id="passwordBtn" type="button" hidden>Change my password</button></p>
  </main>

  <div class="bulkbar" id="bulkBar" hidden>
    <button class="btn btn--danger-solid btn--lg btn--block" id="bulkDeleteBtn" type="button" disabled></button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet cust-sheet" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head cust-sheet__head">
      <div class="grow">
        <h2 class="cust-sheet__title" id="drawerTitle"></h2>
        <div class="sub" id="drawerSub"></div>
      </div>
      <button class="sheet__close" id="closeDrawer" type="button" aria-label="Close"></button>
    </div>
    <div class="cust-status" id="statusRow"></div>
    <div class="cust-actions" id="custActions">
      <button class="btn" id="printBtn" type="button" hidden>Print / PDF</button>
    </div>
    <div class="cust-body" id="drawerBody"></div>
  </aside>
</body>
</html>
