<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar home-top" data-bell>
    <img class="home-mark" src="asg-mark.svg" alt="" width="46" height="40">
    <div class="topbar__title">
      <div class="sub" id="today"></div>
      <h1 id="greeting">Home</h1>
    </div>
    <button class="btn btn--primary home-create" id="createBtn" type="button"></button>
  </header>

  <main class="home">
    <div class="alert" id="pageError" role="alert" hidden></div>
    <div class="home-grid">
      <div class="home-col">
        <section class="home-appt" id="nextAppt" aria-label="Next appointment"><div class="skel home-skel-hero"></div></section>
        <section class="card home-needs" id="needsYou" aria-labelledby="needsTitle">
          <div class="card__head"><h2 id="needsTitle">Needs you today</h2></div>
          <div class="home-pad"><div class="skel home-skel-row"></div><div class="skel home-skel-row"></div></div>
        </section>
      </div>
      <div class="home-col">
        <section class="card card--pad home-contest" id="contest" aria-labelledby="contestTitle">
          <h2 class="home-card-title" id="contestTitle">Contest progress</h2>
          <div class="skel home-skel-big"></div><div class="skel home-skel-row"></div>
        </section>
        <section class="card card--pad home-week" id="thisWeek" aria-labelledby="weekTitle">
          <h2 class="home-card-title" id="weekTitle">This week</h2>
          <div class="skel home-skel-big"></div>
        </section>
      </div>
    </div>
    <p class="sub home-updated" id="lastUpdated">Loading…</p>
  </main>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="admin.js"></script>
  <script src="alerts.js"></script>
  <script src="home.js"></script>
</body>
</html>
