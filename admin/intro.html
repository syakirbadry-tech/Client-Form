<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
  <script defer blocking="render" src="icons.js"></script>
  <script defer blocking="render" src="admin.js"></script>
  <script defer blocking="render" src="intro.js"></script>
</head>
<body>
  <main class="intro" id="intro">
    <div class="intro__bar">
      <button class="btn btn--ghost intro__back" id="backBtn" type="button" hidden></button>
      <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <button class="btn btn--ghost intro__skip" id="skipBtn" type="button">Skip</button>
    </div>
    <p class="sr-only" id="stepLabel" aria-live="polite"></p>
    <section class="intro__step" id="step1"></section>
    <section class="intro__step" id="step2" hidden></section>
    <section class="intro__step" id="step3" hidden></section>
    <section class="intro__step" id="step4" hidden></section>
  </main>
</body>
</html>
