<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://prubsn-submission-service.syakirbadry.workers.dev; img-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="asg-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Appointments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="asg.css">
  <link rel="stylesheet" href="legacy.css">
  <link rel="stylesheet" href="app.css">
  <script defer blocking="render" src="icons.js"></script>
  <script defer blocking="render" src="admin.js"></script>
  <script defer blocking="render" src="appointments.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">
      <h1>Appointments</h1>
      <div class="sub" id="lastUpdated">Loading…</div>
    </div>
  </header>

  <main>
    <div class="alert" id="pageError" role="alert" hidden></div>

    <div class="cal-bar">
      <div class="cal-nav">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous"></button>
        <button class="btn" id="todayBtn" type="button">Today</button>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Next"></button>
        <h2 class="cal-title" id="calTitle" aria-live="polite"></h2>
      </div>
      <div class="chips" role="group" aria-label="Calendar view" id="viewChips"></div>
      <button class="btn btn--primary" id="addBtn" type="button">Book appointment</button>
    </div>

    <section class="card cal-panel" id="calendar"></section>

    <section class="card card--pad">
      <h2>Next 7 days</h2>
      <ul class="cal-upcoming" id="upcoming"></ul>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet cust-sheet" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head cust-sheet__head">
      <div class="grow">
        <h2 class="cust-sheet__title" id="drawerTitle">New appointment</h2>
        <div class="sub">Pick a name from your VB list. It moves to VB3.</div>
      </div>
      <button class="sheet__close" id="closeDrawer" type="button" aria-label="Close"></button>
    </div>
    <div class="cust-body" id="drawerBody"></div>
  </aside>
</body>
</html>
